name: Build Release Assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build
        required: true

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            echo "A release tag is required." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "FloatAnchor $TAG" \
              --notes "Improve WebDAV bidirectional sync and restore missing remote image cache."

  build-windows:
    needs: prepare-release
    runs-on: windows-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm run build:win -- --publish never

      - name: Show Windows release assets
        shell: pwsh
        run: Get-ChildItem release | Format-Table Name,Length,LastWriteTime -AutoSize

      - name: Upload Windows release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          $assets = @(
            (Get-ChildItem "release\FloatAnchor-*-win-setup.exe").FullName
            (Get-ChildItem "release\FloatAnchor-*-win-setup.exe.blockmap").FullName
            (Get-Item "release\latest.yml").FullName
          )
          gh release upload $env:TAG $assets --repo $env:GITHUB_REPOSITORY --clobber

  build-macos:
    needs: prepare-release
    runs-on: macos-latest

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Show macOS release assets
        run: ls -lah release

      - name: Upload macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            release/FloatAnchor-*-mac-*.dmg \
            release/FloatAnchor-*-mac-*.dmg.blockmap \
            release/latest-mac.yml \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
